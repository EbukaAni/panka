<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbdcd1;
        --paper-alt: #fcf3e1;
        --ink: #191530;
        --ink-soft: #4a4560;
        --muted: #7a7590;
        --line: #e4deef;
        --purple: #2a546d;
        --purple-deep: #397294;
        --purple-tint: #efeafb;
        --amber: #c8a96e;
        --white: #ffffff;
        --danger: #a3312b;
        --radius-sm: 4px;
        --maxw: 1060px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--white);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3 {
        font-family: "Source Serif 4", serif;
        color: var(--ink);
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      a {
        color: inherit;
      }

      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 32px;
        width: 100%;
      }

      /* Header */
      header {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        color: var(--purple);
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Source Serif 4", serif;
        font-weight: 600;
        font-size: 21px;
        text-decoration: none;
      }
      .header-link {
        font-size: 14.5px;
        color: var(--ink-soft);
        text-decoration: none;
      }
      .header-link:hover {
        color: var(--ink);
      }

      /* Hero */
      .hero {
        flex: 1;
        background: var(--paper);
        display: flex;
        align-items: center;
        padding: 56px 0;
      }
      .hero .wrap {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 48px;
        align-items: center;
      }
      .hero-copy h1 {
        font-size: clamp(2.3rem, 4vw, 3.25rem);
        line-height: 1.08;
        max-width: 16ch;
        font-weight: 700;
      }
      .hero-copy p {
        margin-top: 22px;
        color: var(--ink-soft);
        max-width: 44ch;
      }

      /* Sign-in card */
      .card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px 28px;
        box-shadow: 0 24px 48px -26px rgba(25, 21, 48, 0.3);
      }
      .card h2 {
        font-size: 22px;
      }
      .card .sub {
        margin-top: 6px;
        font-size: 14.5px;
        color: var(--ink-soft);
      }

      .google-slot {
        margin-top: 24px;
        min-height: 44px;
        display: flex;
        justify-content: center;
      }

      .google-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        height: 44px;
        padding: 0 16px;
        background: var(--white);
        color: #3c4043;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 15px;
        text-decoration: none;
        border: 1px solid #dadce0;
        border-radius: var(--radius-sm);
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .google-btn:hover {
        background: #f8f9fa;
        border-color: #c6c9ce;
      }
      .google-btn:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .divider {
        margin: 24px 0 16px;
        border-top: 1px solid var(--line);
      }

      .fine {
        font-size: 13.5px;
        color: var(--muted);
      }
      .fine a {
        color: var(--purple-deep);
      }

      .error {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--danger);
        background: #fdf0ef;
        border: 1px solid #f0c9c6;
        border-radius: var(--radius-sm);
      }
      .error.show {
        display: block;
      }

      .status {
        display: none;
        margin-top: 16px;
        font-size: 14px;
        color: var(--ink-soft);
        align-items: center;
        gap: 10px;
      }
      .status.show {
        display: flex;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--line);
        border-top-color: var(--purple);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Trust line */
      .trustline {
        border-top: 1px solid var(--line);
        padding: 22px 0;
        background: var(--paper-alt);
        text-align: center;
      }
      .trustline p {
        color: var(--ink-soft);
        font-size: 15px;
      }

      /* Footer */
      footer {
        padding: 24px 0;
      }
      footer .wrap {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      footer p,
      footer a {
        color: var(--muted);
        font-size: 13.5px;
      }

      @media (max-width: 860px) {
        .hero .wrap {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .hero {
          padding: 40px 0;
        }
      }
      @media (max-width: 420px) {
        .wrap {
          padding: 0 20px;
        }
        .card {
          padding: 28px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="wrap">
        <div class="hero-copy">
          <h1>Welcome back</h1>
          <p>Sign in with your Google account to pick up where you left off.</p>
        </div>

        <div class="card">
          <h2>Sign in</h2>
          <p class="sub">Use the Google account you signed up with.</p>

          <div class="google-slot">
            <a class="google-btn" id="google-btn" href="/auth/google">
              <svg
                width="18"
                height="18"
                viewBox="0 0 48 48"
                aria-hidden="true"
              >
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                />
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                />
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                />
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                />
              </svg>
              <span>Sign in with Google</span>
            </a>
          </div>

          <div class="error" id="error" role="alert"></div>

          <div class="divider"></div>
          <p class="fine" id="help">
            We only use your Google name, email and photo. By signing in you
            agree to our
            <a href="/terms">Terms</a> and
            <a href="/privacy">Privacy Policy</a>.
          </p>
        </div>
      </div>
    </main>

    <script>
      // Passport redirects back here with ?error=... when sign-in fails or is cancelled.
      const params = new URLSearchParams(window.location.search);
      if (params.has("error")) {
        const el = document.getElementById("error");
        el.textContent = "We couldn’t sign you in with Google. Try again.";
        el.classList.add("show");
      }

      // Optional: remember where the user was headed (your server can read ?next=).
      const next = params.get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) {
        document.getElementById("google-btn").href =
          "/auth/google?next=" + encodeURIComponent(next);
      }
    </script>
  </body>
</html>
